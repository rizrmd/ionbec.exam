networks:
    frontend:
        driver: ${DOCKER_NETWORKS_DRIVER:-bridge}
    backend:
        driver: ${DOCKER_NETWORKS_DRIVER:-bridge}

services:
    gateway:
        image: nginx
        restart: unless-stopped
        volumes:
            - ./docker/matter/gateway:/etc/nginx/conf.d
        ports:
            - "${DOCKER_PORT:-8000}:80"
        networks:
            - frontend
            - backend
        depends_on:
            - octane
            - soketi
    octane:
        build:
            context: docker/image
            args:
                - USER_CONTAINER=${DOCKER_USER:-dokar}
                - PUID=${DOCKER_PUID:-1000}
                - PGID=${DOCKER_PGID:-1000}
        logging:
            options:
                max-size: "10m"
                max-file: "3"
        restart: unless-stopped
        depends_on:
            - redis
        volumes:
            # laravel comes up with public dir inside workdir, so we will mount only /var/www
            - ./:/var/www
        environment:
            DOCKER_ENV: ${APP_ENV}
        networks:
            - backend
        working_dir: /var/www
    redis:
        image: redis
        restart: unless-stopped
        volumes:
            - ${DOCKER_DATA_PATH_HOST:-./docker/data}/redis:/data
        networks:
            - backend
    # Uncomment if you want to use local PostgreSQL instead of external
    # postgres:
    #     image: postgres:15-alpine
    #     restart: unless-stopped
    #     environment:
    #         POSTGRES_DB: ${DB_DATABASE}
    #         POSTGRES_USER: ${DB_USERNAME}
    #         POSTGRES_PASSWORD: ${DB_PASSWORD}
    #     volumes:
    #         - ${DOCKER_DATA_PATH_HOST}/postgres:/var/lib/postgresql/data
    #     ports:
    #         - "5432:5432"
    #     networks:
    #         - backend
    horizon:
        image: ghcr.io/digital-entropy/dokar-php/cli:8.1
        restart: unless-stopped
        depends_on:
            - redis
        volumes:
            - ./:/var/www
            - ./docker/matter/horizon/:/entrypoint.d
        networks:
            - backend
        environment:
            - USER=${DOCKER_USER:-dokar}
            - PUID=${DOCKER_PUID:-1000}
            - PGID=${DOCKER_PGID:-1000}
        working_dir: /var/www
        entrypoint: [ /entrypoint.d/entrypoint.sh ]
    scheduler:
        image: ghcr.io/digital-entropy/dokar-php/cli:8.1
        restart: unless-stopped
        depends_on:
            - redis
        volumes:
            - ./:/var/www
            - ./docker/matter/scheduler/:/entrypoint.d
        networks:
            - backend
        environment:
            - USER=${DOCKER_USER:-dokar}
            - PUID=${DOCKER_PUID:-1000}
            - PGID=${DOCKER_PGID:-1000}
        working_dir: /var/www
        entrypoint: [ /entrypoint.d/entrypoint.sh ]
    soketi:
        image: quay.io/soketi/soketi:latest-16-alpine
        restart: unless-stopped
        ports:
            - 6001
        logging:
            options:
                max-size: "10m"
        environment:
            - DEBUG=${APP_DEBUG}
            - METRICS_SERVER_PORT='9601'
            - SOKETI_DB_REDIS_HOST=redis
            - SOKETI_DB_REDIS_PORT=6379
            - SOKETI_DB_REDIS_KEY_PREFIX=soketi
            - SOKETI_DEFAULT_APP_ID=${PUSHER_APP_ID}
            - SOKETI_DEFAULT_APP_KEY=${PUSHER_APP_KEY}
            - SOKETI_DEFAULT_APP_SECRET=${PUSHER_APP_SECRET}
        networks:
            - backend
    rust-service:
        build:
            context: ./rust-service
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "${RUST_SERVICE_PORT:-3000}:3000"
        environment:
            - RUST_LOG=${RUST_LOG:-info}
            - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}
            - REDIS_URL=redis://redis:6379
        depends_on:
            - redis
        networks:
            - backend
        volumes:
            - ./storage/app/public:/app/storage:ro
