# Nixpacks configuration for Laravel app only
# Note: Rust service needs to be deployed separately in Coolify

[phases.build]
nixPkgs = ["nodejs", "npm"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run production"
]

[phases.setup]
cmds = [
    "php artisan package:discover --ansi",
    "php artisan config:clear",
    "php artisan route:clear", 
    "php artisan view:clear"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=3000"

[variables]
NIXPACKS_METADATA = "laravel"